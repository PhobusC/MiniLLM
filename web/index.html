<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniLLM</title>
<style>
  :root {
    --bg: #faf9f7; --fg: #1f1e1c; --muted: #6b6862; --line: #e4e1db;
    --user-bg: #efece6; --input-bg: #ffffff; --accent: #1f1e1c; --accent-fg: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1b1a; --fg: #ecebe8; --muted: #9b978f; --line: #34322f;
      --user-bg: #2c2a27; --input-bg: #252422; --accent: #ecebe8; --accent-fg: #1c1b1a;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.6 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  #log { flex: 1; overflow-y: auto; padding: 32px 16px 16px; }
  .col { max-width: 720px; margin: 0 auto; }
  .empty { color: var(--muted); text-align: center; margin-top: 30vh; font-size: 20px; }
  .msg { margin: 0 0 24px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { margin-left: auto; width: fit-content; max-width: 85%;
              background: var(--user-bg); padding: 10px 16px; border-radius: 18px; }
  .msg.bot.pending::after { content: "▍"; color: var(--muted); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  form { padding: 0 16px 20px; }
  .box { display: flex; gap: 8px; align-items: flex-end; background: var(--input-bg);
         border: 1px solid var(--line); border-radius: 20px; padding: 10px 10px 10px 16px; }
  textarea { flex: 1; resize: none; border: 0; outline: 0; background: transparent; color: inherit;
             font: inherit; max-height: 200px; padding: 4px 0; }
  button { border: 0; border-radius: 12px; width: 36px; height: 36px; cursor: pointer;
           background: var(--accent); color: var(--accent-fg); font-size: 18px; flex: none; }
  button:disabled { opacity: 0.35; cursor: default; }
</style>
</head>
<body>
<main id="log"><div class="col" id="messages"><div class="empty" id="empty">Start a story…</div></div></main>
<form id="form">
  <div class="col box">
    <textarea id="input" rows="1" placeholder="Message MiniLLM" autofocus></textarea>
    <button id="send" type="submit" aria-label="Send" disabled>↑</button>
  </div>
</form>
<script>
  const log = document.getElementById("log");
  const messages = document.getElementById("messages");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const form = document.getElementById("form");
  let busy = false;

  function addMessage(role, text) {
    document.getElementById("empty")?.remove();
    const el = document.createElement("div");
    el.className = `msg ${role}`;
    el.textContent = text;
    messages.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  function refresh() {
    send.disabled = busy || !input.value.trim();
    input.style.height = "auto";
    input.style.height = input.scrollHeight + "px";
  }

  async function submit() {
    const prompt = input.value.trim();
    if (!prompt || busy) return;
    busy = true;
    input.value = "";
    refresh();
    addMessage("user", prompt);
    const bot = addMessage("bot pending", "");
    try {
      const res = await fetch("/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        bot.textContent += decoder.decode(value, { stream: true });
        log.scrollTop = log.scrollHeight;
      }
      if (!bot.textContent) bot.textContent = "(no reply)";
    } catch (err) {
      bot.textContent = `Error: ${err.message}`;
    } finally {
      bot.classList.remove("pending");
      busy = false;
      refresh();
      input.focus();
    }
  }

  form.addEventListener("submit", (e) => { e.preventDefault(); submit(); });
  input.addEventListener("input", refresh);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
  });
</script>
</body>
</html>
